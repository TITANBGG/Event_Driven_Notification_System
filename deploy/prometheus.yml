# WHAT: Prometheus scrape configuration targeting api, worker-1, and worker-2 metrics ports.
# WHY: Centralizes scrape intervals (5s) so both worker replicas and API metrics endpoints appear
#      automatically on Prometheus UI (:9090) once /metrics handlers are wired in Phase 6.
# EXPECTED OUTPUT EXAMPLE (`http://localhost:9090/targets`):
#   jobs: notification-api (api:8080), notification-worker (worker-1:9091, worker-2:9091)

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: notification-api
    static_configs:
      - targets:
          - api:8080

  - job_name: notification-worker
    static_configs:
      - targets:
          - worker-1:9091
          - worker-2:9091

