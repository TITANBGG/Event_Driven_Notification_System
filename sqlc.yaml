# WHAT: sqlc v2 codegen configuration mapping PostgreSQL schema + queries to type-safe pgx/v5 Go methods.
# WHY: Eliminates runtime SQL syntax/column bugs and prevents string-concatenated SQL injections.
# EXPECTED OUTPUT EXAMPLE (`make sqlc`):
#   Generates internal/repository/sqlc/{db.go,models.go,*.sql.go} with zero diff on repeat runs.

version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

