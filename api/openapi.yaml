openapi: 3.0.3
info:
  title: Event-Driven Notification System API
  version: 1.1.1
  description: |
    Multi-channel (SMS, email, push) notification API. Requests are validated and persisted in PostgreSQL
    (the source of truth), then queued in Redis for asynchronous delivery by stateless workers
    (max 100 sends/s per channel, weighted high/normal/low priority, retries with full-jitter backoff,
    per-channel circuit breaker, dead-letter queue and manual retry).

    **Authentication**
    - When `API_KEYS` is configured, every `/api/v1` operation needs `Authorization: Bearer <api key>`; each operation
      names its required scope (`read`, `write`, `admin`) in `x-required-scope`. Missing/invalid key: `401 unauthorized`;
      valid key without the scope: `403 forbidden`. Health probes, `/metrics`, `/openapi.yaml` and `/demo` stay public.
      In Swagger UI use **Authorize** with the local key `local-dev-key-change-me`.

    **Conventions**
    - JSON uses camelCase; timestamps are RFC3339 UTC; IDs are UUIDv7. Unknown JSON fields are rejected (`400`).
    - `X-Correlation-ID` is accepted on every request (or generated) and echoed in the response header and in
      every error body. A W3C `traceparent` header continues the caller's trace through API, queue, worker and provider.
    - `Idempotency-Key` on `POST /api/v1/notifications` and `POST /api/v1/notifications/batch`: the same key with
      the same canonical body replays the original `202` response with `Idempotent-Replayed: true`; the same key with a
      different body returns `409 idempotency_conflict`. Keys expire after 24h.
    - Delivery is at-least-once. The provider receives `Idempotency-Key: <notification id>` on every attempt so it can
      deduplicate retries.

    **Error codes** (`error.code` in the common `ErrorResponse` envelope): `malformed_json`, `unsupported_media_type`,
    `payload_too_large`, `validation_failed`, `batch_too_large`, `invalid_uuid`, `invalid_channel`, `invalid_cursor`,
    `not_found`, `invalid_transition`, `idempotency_conflict`, `item_idempotency_key_exists`, `duplicate_idempotency_key`,
    `template_not_found`, `missing_variable`, `not_cancellable`, `not_retryable`, `template_name_exists`,
    `missing_ws_filter`, `upgrade_required`, `unauthorized`, `forbidden`, `forbidden_origin`, `too_many_ws_clients`, `method_not_allowed`,
    `request_timeout`, `service_unavailable`, `internal_error`. Field-level problems are listed in `error.details[]`
    with dot/bracket paths such as `notifications[3].recipient`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local API server
security:
  - bearerAuth: []

tags:
  - name: System
    description: Health probes and OpenAPI contract
  - name: Notifications
    description: Single and batch notification submission, queries, cancellation, and manual retry
  - name: Batches
    description: Batch status aggregation and bulk cancellation
  - name: Templates
    description: Message template management and variable substitution preview
  - name: Realtime
    description: WebSocket live status updates and interactive demo dashboard

paths:
  /health/live:
    get:
      operationId: getHealthLive
      security: []
      tags: [System]
      summary: Liveness probe
      description: Returns 200 OK when the API process is running and serving HTTP requests.
      responses:
        "200":
          description: Process is alive
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
              example:
                status: ok

  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      security: []
      tags: [System]
      summary: Download OpenAPI specification
      description: Serves the embedded OpenAPI 3.0.3 YAML document.
      responses:
        "200":
          description: OpenAPI YAML document
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/yaml:
              schema:
                type: string

  /demo:
    get:
      operationId: getDemoDashboard
      security: []
      tags: [Realtime]
      summary: Interactive live WebSocket demo dashboard
      description: Serves a single-page HTML dashboard (`go:embed`) that creates notification batches and streams live status updates over `GET /api/v1/ws`.
      responses:
        "200":
          description: Interactive HTML dashboard
          content:
            text/html:
              schema:
                type: string

  /api/v1/notifications:
    post:
      operationId: createNotification
      x-required-scope: write
      tags: [Notifications]
      summary: Create a single notification
      description: |
        Validates and persists a pending notification atomically with its optional Idempotency-Key in PostgreSQL,
        then enqueues it for asynchronous worker processing.
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
            examples:
              turkishSms:
                summary: Turkish SMS high priority notification
                value:
                  recipient: "+905551234567"
                  channel: sms
                  content: "Siparişiniz kargoya verildi"
                  priority: high
              email:
                summary: Email notification with optional subject
                value:
                  recipient: "customer@example.com"
                  channel: email
                  subject: "Order #42 Shipped"
                  content: "Your order has left our warehouse."
                  priority: normal
              push:
                summary: Push notification with title
                value:
                  recipient: "fcm-token-9b7a2c1e"
                  channel: push
                  title: "Package Delivered"
                  content: "Your delivery has arrived."
              scheduledSms:
                summary: Scheduled SMS notification (future delivery)
                value:
                  recipient: "+905551234567"
                  channel: sms
                  content: "Scheduled campaign reminder"
                  priority: high
                  scheduledAt: "2026-11-21T15:30:00+03:00"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          description: Notification accepted for asynchronous delivery (or replayed via Idempotency-Key)
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
              example:
                id: 01a1faed-d97c-7d59-b513-70207b434dda
                batchId: null
                recipient: "+905551234567"
                channel: sms
                priority: high
                status: pending
                content: "Siparişiniz kargoya verildi"
                attempts: 0
                maxAttempts: 5
                scheduledAt: null
                nextAttemptAt: null
                providerMessageId: null
                lastError: null
                createdAt: "2026-11-20T21:47:34.141017Z"
                updatedAt: "2026-11-20T21:47:34.141017Z"
                sentAt: null
                failedAt: null
                cancelledAt: null
        "400":
          $ref: "#/components/responses/MalformedJSON"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      operationId: listNotifications
      x-required-scope: read
      tags: [Notifications]
      summary: List notifications with filters and keyset pagination
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - name: status
          in: query
          description: Comma-separated status filter (`scheduled,pending,processing,retrying,sent,failed,cancelled`)
          schema:
            type: string
            example: pending,failed
        - name: channel
          in: query
          schema:
            type: string
            enum: [sms, email, push]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, normal, low]
        - name: from
          in: query
          description: Inclusive RFC3339 lower bound on createdAt
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive RFC3339 upper bound on createdAt
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque keyset pagination cursor returned by a previous response
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Paginated list of notifications ordered newest first
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/BadCursor"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notifications/batch:
    post:
      operationId: createBatch
      x-required-scope: write
      tags: [Notifications]
      summary: Create a batch of notifications (up to 1000 items, all-or-nothing)
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRequest"
            examples:
              mixedChannels:
                summary: SMS + email + push in one all-or-nothing batch
                value:
                  notifications:
                    - recipient: "+905551234501"
                      channel: sms
                      priority: high
                      content: "Flaş indirim başladı!"
                      idempotencyKey: flash-sale-sms-1
                    - recipient: "user@example.com"
                      channel: email
                      subject: "Flash sale"
                      content: "50% off today."
                    - recipient: "fcm-device-token-12345"
                      channel: push
                      priority: low
                      title: "Sale"
                      content: "Tap to view."
              templateBatch:
                summary: Personalized SMS rendered from a template at creation time
                value:
                  notifications:
                    - recipient: "+905551230001"
                      channel: sms
                      templateId: 01a1faed-ed53-7075-b03f-819061f52f93
                      templateVariables: {name: "Ayşe", code: "4821"}
                    - recipient: "+905551230002"
                      channel: sms
                      templateId: 01a1faed-ed53-7075-b03f-819061f52f93
                      templateVariables: {name: "Mehmet", code: "9037"}
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "202":
          description: Batch persisted atomically and queued for delivery
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
              example:
                batchId: 01a1faec-a20c-7096-8bf9-575c7d4cea60
                count: 3
                notificationIds:
                  - 01a1faec-a20c-70b2-ad01-4dde0bb40b1a
                  - 01a1faec-a20c-70b5-af63-e4cd1d0c725b
                  - 01a1faec-a20c-70b7-a12c-4876d3d4015f
        "400":
          $ref: "#/components/responses/MalformedJSON"
        "409":
          $ref: "#/components/responses/BatchConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notifications/{id}:
    get:
      operationId: getNotification
      x-required-scope: read
      tags: [Notifications]
      summary: Get notification status and delivery attempts by ID
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Notification details with chronological delivery attempts
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDetailResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notifications/{id}/cancel:
    post:
      operationId: cancelNotification
      x-required-scope: write
      tags: [Notifications]
      summary: Cancel a pending, scheduled, or retrying notification
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Notification cancelled atomically
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotCancellable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notifications/{id}/retry:
    post:
      operationId: retryNotification
      x-required-scope: admin
      tags: [Notifications]
      summary: Manually retry a failed notification (DLQ replay)
      description: Resets attempts and deferrals to 0, clears lastError, transitions status from failed to pending, and re-enqueues.
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Notification reset to pending and re-enqueued
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotRetryable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/batches/{id}:
    get:
      operationId: getBatch
      x-required-scope: read
      tags: [Batches]
      summary: Get batch summary counts and paginated batch items
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Batch aggregate summary and page of items
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetailResponse"
        "400":
          $ref: "#/components/responses/InvalidUUIDOrCursor"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/batches/{id}/cancel:
    post:
      operationId: cancelBatch
      x-required-scope: write
      tags: [Batches]
      summary: Cancel all cancellable notifications in a batch
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Atomic batch cancellation counts
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCancelResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/templates:
    post:
      operationId: createTemplate
      x-required-scope: write
      tags: [Templates]
      summary: Create a message template with {{variable}} placeholders
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTemplateRequest"
            example:
              name: otp_sms_tr
              channel: sms
              body: "Merhaba {{name}}, doğrulama kodunuz: {{code}}"
              variables: [name, code]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Template created
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/MalformedJSON"
        "409":
          $ref: "#/components/responses/TemplateNameConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      operationId: listTemplates
      x-required-scope: read
      tags: [Templates]
      summary: List active templates with optional channel filter and cursor pagination
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - name: channel
          in: query
          schema:
            type: string
            enum: [sms, email, push]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Paginated list of active templates
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"
        "400":
          $ref: "#/components/responses/BadCursor"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/templates/{id}:
    get:
      operationId: getTemplate
      x-required-scope: read
      tags: [Templates]
      summary: Get an active template by ID
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Template details
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: updateTemplate
      x-required-scope: write
      tags: [Templates]
      summary: Update an active template by ID
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTemplateRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Template updated
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/InvalidUUIDOrMalformedJSON"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TemplateNameConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: deleteTemplate
      x-required-scope: write
      tags: [Templates]
      summary: Soft-delete a template by ID
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "204":
          description: Template soft-deleted
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/templates/{id}/preview:
    post:
      operationId: previewTemplate
      x-required-scope: read
      tags: [Templates]
      summary: Render a template preview with sample variables and SMS encoding metrics
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePreviewRequest"
            example:
              variables:
                name: "Ayşe"
                code: "4821"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Rendered preview with SMS segmentation info and unused variables list
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePreviewResponse"
        "400":
          $ref: "#/components/responses/InvalidUUIDOrMalformedJSON"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/ws:
    get:
      operationId: streamNotificationEventsWS
      x-required-scope: read
      tags: [Realtime]
      summary: WebSocket stream for real-time notification status transitions
      description: |
        Upgrades the HTTP connection to a WebSocket (`101 Switching Protocols`).
        At least one filter query parameter (`notificationId`, `batchId`, or `channel`) is required; multiple filters are AND-combined.
        On connect, the server subscribes to the Hub first, then sends a `WSSnapshotMessage` (`{"type":"snapshot",...}`) for `notificationId` or `batchId`,
        and finally streams live `RealtimeStatusEvent` JSON frames from Redis pub/sub (`notif:events`).
        Each client has its own queue that absorbs bursts (one 1,000-item batch publishes 1,000 events at once). A client is
        disconnected as slow when more than 1,024 frames are queued and it has delivered none for 5 seconds, or when more
        than 8,192 are queued. It receives close code `1008` (Policy Violation) when the close frame can still be delivered;
        a client that has stopped reading entirely (full TCP window) is cut by the 5-second write timeout and sees `1006`.
      parameters:
        - name: notificationId
          in: query
          description: Filter events for a single notification UUID
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          description: Filter events for all notifications belonging to a batch UUID
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          description: Filter events by delivery channel (`sms`, `email`, `push`)
          schema:
            type: string
            enum: [sms, email, push]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "101":
          description: |
            Switching Protocols. OpenAPI 3.0 cannot describe WebSocket frames natively, so the content below documents
            the JSON payload of each text frame sent after the upgrade: one `WSSnapshotMessage` (for `notificationId` /
            `batchId` filters) followed by `RealtimeStatusEvent` frames. The server never reads client frames.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WSSnapshotMessage"
                  - $ref: "#/components/schemas/RealtimeStatusEvent"
              examples:
                event:
                  summary: Live status event
                  value:
                    type: event
                    notificationId: 01a1faec-a20c-70b2-ad01-4dde0bb40b1a
                    batchId: 01a1faec-a20c-7096-8bf9-575c7d4cea60
                    channel: sms
                    status: sent
                    attempt: 1
                    error: null
                    occurredAt: "2026-11-20T21:46:14.449266Z"
                    correlationId: corr-order-42
        "400":
          description: Missing filter query parameter or invalid UUID/channel before WebSocket upgrade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: missing_ws_filter
                  message: at least one filter query parameter (notificationId, batchId, or channel) is required
                correlationId: 01a1faec-fa8d-7807-bd64-5e7e9125458f
        "403":
          $ref: "#/components/responses/ForbiddenOriginOrScope"
        "426":
          description: "Valid filter but not a WebSocket upgrade request (`Connection: Upgrade` and `Upgrade: websocket` are required)"
          headers:
            Upgrade:
              description: Always `websocket`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: upgrade_required
                  message: "this endpoint only accepts WebSocket upgrade requests (Connection: Upgrade, Upgrade: websocket)"
                correlationId: 01a1faec-fa8d-7807-bd64-5e7e9125458f
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Maximum concurrent WebSocket clients (`MAX_WS_CLIENTS`) exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      operationId: getHealth
      security: []
      tags: [System]
      summary: Dependency readiness alias
      description: Alias for /health/ready checking PostgreSQL and Redis connectivity (1s timeout each).
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              example:
                status: degraded
                checks:
                  postgres: {status: down, latencyMs: 1000}
                  redis: {status: ok, latencyMs: 0}

  /health/ready:
    get:
      operationId: getHealthReady
      security: []
      tags: [System]
      summary: Readiness probe
      description: Pings PostgreSQL and Redis with a 1s timeout each and returns 503 if any fails.
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              example:
                status: ok
                checks:
                  postgres: {status: ok, latencyMs: 2}
                  redis: {status: ok, latencyMs: 1}
        "503":
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              example:
                status: degraded
                checks:
                  postgres: {status: down, latencyMs: 1000}
                  redis: {status: ok, latencyMs: 0}

  /metrics:
    get:
      operationId: getPrometheusMetrics
      security: []
      tags: [System]
      summary: Prometheus metrics exposition
      description: Exposes Prometheus text exposition format metrics registered on a dedicated custom Registry.
      responses:
        "200":
          description: Prometheus metrics scrape output
          content:
            text/plain:
              schema:
                type: string

  /api/v1/metrics:
    get:
      operationId: getMetricsSnapshot
      x-required-scope: read
      tags: [System]
      summary: Real-time JSON observability snapshot
      description: Returns live Redis queue depths, 1m/5m/15m per-channel delivery counts and rates, and 15m p50/p95/p99 latency percentiles (2s cache).
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Metrics snapshot
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    CorrelationIDHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Client correlation identifier (1..128 chars `[A-Za-z0-9._-]`). Auto-generated if omitted or invalid.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    TraceparentHeader:
      name: traceparent
      in: header
      required: false
      description: Optional W3C TraceContext header (`00-<32hex-trace-id>-<16hex-span-id>-<2hex-flags>`) propagated through PostgreSQL, Redis queues, worker processing spans, and outgoing provider HTTP calls.
      schema:
        type: string
        example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency token (1..255 printable ASCII characters, 24h TTL).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UUIDPathParam:
      name: id
      in: path
      required: true
      description: Resource UUID (UUIDv7)
      schema:
        type: string
        format: uuid

  headers:
    CorrelationIDResponse:
      description: Echoed or server-generated request correlation ID
      schema:
        type: string
    IdempotentReplayed:
      description: Present with value `"true"` when returning a stored idempotent response
      schema:
        type: string
        enum: ["true"]

  schemas:
    LiveStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    DependencyCheck:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [ok, down]
        latencyMs:
          type: integer
          format: int64

    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyCheck"
            redis:
              $ref: "#/components/schemas/DependencyCheck"

    ChannelQueueDepths:
      type: object
      required: [high, normal, low]
      properties:
        high:
          type: integer
          format: int64
        normal:
          type: integer
          format: int64
        low:
          type: integer
          format: int64

    QueuesSnapshot:
      type: object
      required: [sms, email, push, delayed, dlq, inflight]
      properties:
        sms:
          $ref: "#/components/schemas/ChannelQueueDepths"
        email:
          $ref: "#/components/schemas/ChannelQueueDepths"
        push:
          $ref: "#/components/schemas/ChannelQueueDepths"
        delayed:
          type: integer
          format: int64
        dlq:
          type: integer
          format: int64
        inflight:
          type: integer
          format: int64

    WindowChannelMetrics:
      type: object
      required: [sent, failed, retrying, successRate, failureRate]
      properties:
        sent:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        retrying:
          type: integer
          format: int64
        successRate:
          type: number
          format: double
          nullable: true
          description: sent / (sent + failed); null when the window has neither, so no traffic does not read as 0% success.
        failureRate:
          type: number
          format: double
          nullable: true
          description: failed / (sent + failed); null when the window has neither.

    WindowChannels:
      type: object
      required: [sms, email, push]
      properties:
        sms:
          $ref: "#/components/schemas/WindowChannelMetrics"
        email:
          $ref: "#/components/schemas/WindowChannelMetrics"
        push:
          $ref: "#/components/schemas/WindowChannelMetrics"

    MetricsWindows:
      type: object
      description: Trailing windows ending at generatedAt, always all three, in this order.
      required: ["1m", "5m", "15m"]
      properties:
        1m:
          $ref: "#/components/schemas/WindowChannels"
        5m:
          $ref: "#/components/schemas/WindowChannels"
        15m:
          $ref: "#/components/schemas/WindowChannels"

    LatencyPercentiles:
      type: object
      required: [p50, p95, p99]
      properties:
        p50:
          type: number
          format: double
        p95:
          type: number
          format: double
        p99:
          type: number
          format: double

    LatencyMetrics:
      type: object
      required: [endToEnd, providerCall]
      properties:
        endToEnd:
          $ref: "#/components/schemas/LatencyPercentiles"
        providerCall:
          $ref: "#/components/schemas/LatencyPercentiles"

    MetricsSnapshot:
      type: object
      required: [generatedAt, queues, windows, latencyMs]
      properties:
        generatedAt:
          type: string
          format: date-time
        queues:
          $ref: "#/components/schemas/QueuesSnapshot"
        windows:
          $ref: "#/components/schemas/MetricsWindows"
        latencyMs:
          $ref: "#/components/schemas/LatencyMetrics"

    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [recipient, channel]
      properties:
        recipient:
          type: string
          description: E.164 phone number (`sms`), bare email address (`email`), or device token (`push`)
        channel:
          type: string
          enum: [sms, email, push]
        content:
          type: string
          description: Message body (provide either `content` or `templateId` + `templateVariables`, never both)
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        subject:
          type: string
          maxLength: 200
          description: Optional subject for `email` channel only
        title:
          type: string
          maxLength: 100
          description: Optional notification title for `push` channel only
        scheduledAt:
          type: string
          format: date-time
          description: Optional RFC3339 delivery timestamp (`> now - 2s`, `<= now + 720h`; values `<= now + 1s` dispatch immediately as `pending`, otherwise stored in UTC with status `scheduled`)
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          description: Supported only for items inside POST /api/v1/notifications/batch; single notifications use the Idempotency-Key header.
        templateId:
          type: string
          format: uuid
          description: Active template UUID to render at creation time (mutually exclusive with `content`)
        templateVariables:
          type: object
          additionalProperties: true
          description: Primitive variable map (`string`, `number`, `boolean`) substituted into the template at creation time

    BatchCreateRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CreateNotificationRequest"

    NotificationResponse:
      type: object
      required:
        - id
        - batchId
        - recipient
        - channel
        - priority
        - status
        - content
        - attempts
        - maxAttempts
        - scheduledAt
        - nextAttemptAt
        - providerMessageId
        - lastError
        - createdAt
        - updatedAt
        - sentAt
        - failedAt
        - cancelledAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
          nullable: true
        templateId:
          type: string
          format: uuid
          nullable: true
        recipient:
          type: string
        channel:
          type: string
          enum: [sms, email, push]
        priority:
          type: string
          enum: [high, normal, low]
        status:
          type: string
          enum: [scheduled, pending, processing, retrying, sent, failed, cancelled]
        subject:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        content:
          type: string
        attempts:
          type: integer
        maxAttempts:
          type: integer
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true

    DeliveryAttemptResponse:
      type: object
      required: [id, attemptNo, counted, startedAt, durationMs, httpStatus, outcome, error, providerMessageId]
      properties:
        id:
          type: integer
          format: int64
        attemptNo:
          type: integer
        counted:
          type: boolean
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        httpStatus:
          type: integer
          nullable: true
        outcome:
          type: string
          enum: [sent, transient, permanent, circuit_open, abandoned]
        error:
          type: string
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        workerId:
          type: string
          nullable: true

    NotificationDetailResponse:
      allOf:
        - $ref: "#/components/schemas/NotificationResponse"
        - type: object
          required: [deliveryAttempts]
          properties:
            deliveryAttempts:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryAttemptResponse"

    BatchCreateResponse:
      type: object
      required: [batchId, count, notificationIds]
      properties:
        batchId:
          type: string
          format: uuid
        count:
          type: integer
        notificationIds:
          type: array
          items:
            type: string
            format: uuid

    NotificationListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        nextCursor:
          type: string
          nullable: true

    BatchDetailResponse:
      type: object
      required: [batchId, total, countsByStatus, createdAt, items, nextCursor]
      properties:
        batchId:
          type: string
          format: uuid
        total:
          type: integer
        countsByStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        nextCursor:
          type: string
          nullable: true

    BatchCancelResponse:
      type: object
      required: [batchId, cancelled, notCancellable]
      properties:
        batchId:
          type: string
          format: uuid
        cancelled:
          type: integer
        notCancellable:
          type: integer

    UpsertTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, channel, body]
      properties:
        name:
          type: string
          minLength: 1
        channel:
          type: string
          enum: [sms, email, push]
        subject:
          type: string
          maxLength: 200
        title:
          type: string
          maxLength: 100
        body:
          type: string
          minLength: 1
        variables:
          type: array
          description: Declared placeholder variable names; optional when body/subject/title contain no {{variable}} placeholders.
          items:
            type: string

    TemplateResponse:
      type: object
      required: [id, name, channel, body, variables, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        channel:
          type: string
          enum: [sms, email, push]
        subject:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
        variables:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TemplateResponse"
        nextCursor:
          type: string
          nullable: true

    TemplatePreviewRequest:
      type: object
      additionalProperties: false
      required: [variables]
      properties:
        variables:
          type: object
          additionalProperties: true

    SMSPreviewInfo:
      type: object
      required: [encoding, units, segments]
      properties:
        encoding:
          type: string
          enum: [GSM-7, UCS-2]
        units:
          type: integer
        segments:
          type: integer

    TemplatePreviewResponse:
      type: object
      required: [subject, title, content, unusedVariables]
      properties:
        subject:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        content:
          type: string
        sms:
          $ref: "#/components/schemas/SMSPreviewInfo"
        unusedVariables:
          type: array
          items:
            type: string

    RealtimeStatusEvent:
      type: object
      required: [type, notificationId, batchId, channel, status, attempt, error, occurredAt]
      properties:
        type:
          type: string
          enum: [event]
        notificationId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          enum: [sms, email, push]
        status:
          type: string
          enum: [scheduled, pending, processing, retrying, sent, failed, cancelled]
        attempt:
          type: integer
        error:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string

    WSSnapshotMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [snapshot]
        notification:
          $ref: "#/components/schemas/NotificationResponse"
        batch:
          $ref: "#/components/schemas/BatchDetailResponse"

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
        correlationId:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key configured in `API_KEYS` (`name:secret:scope1|scope2`), sent as `Authorization: Bearer <secret>`.
        Each operation lists the scope it needs in `x-required-scope`: `read`, `write` or `admin` (admin implies all).
        Browsers open the WebSocket with subprotocols `["bearer", "<secret>"]`; the server selects only `bearer`.
        The local docker compose stack enables the admin key `local-dev-key-change-me`.
  responses:
    Unauthorized:
      description: Missing or invalid API key (only when `API_KEYS` is configured)
      headers:
        WWW-Authenticate:
          description: '`Bearer realm="notification-api"`, plus `error="invalid_token"` when a key was sent but not recognized'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: "missing API key: send an Authorization: Bearer header"
            correlationId: 01a1faec-0000-7000-8000-000000000020
    Forbidden:
      description: The API key is valid but lacks the scope this operation requires (`x-required-scope`)
      headers:
        WWW-Authenticate:
          description: '`Bearer realm="notification-api", error="insufficient_scope", scope="<scope>"`'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: "API key lacks the required scope: write"
            correlationId: 01a1faec-0000-7000-8000-000000000021
    ForbiddenOriginOrScope:
      description: |
        Either the API key lacks the `read` scope (`forbidden`) or the request Origin is not in the allowed
        WebSocket origins (`forbidden_origin`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbiddenOrigin:
              value:
                error:
                  code: forbidden_origin
                  message: request origin is not allowed for WebSocket connections
                correlationId: 01a1faec-0000-7000-8000-000000000019
            forbiddenScope:
              value:
                error:
                  code: forbidden
                  message: "API key lacks the required scope: read"
                correlationId: 01a1faec-0000-7000-8000-000000000022
    MalformedJSON:
      description: Malformed JSON, invalid UTF-8, trailing tokens, or unknown fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: malformed_json
              message: 'malformed JSON request: json: unknown field "foo"'
            correlationId: 01a1faec-0000-7000-8000-000000000010
    InvalidUUID:
      description: Invalid UUID path parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_uuid
              message: parameter "id" must be a valid UUID
            correlationId: 01a1faec-0000-7000-8000-000000000011
    InvalidUUIDOrCursor:
      description: Invalid UUID path parameter or malformed pagination cursor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidUuid:
              value:
                error:
                  code: invalid_uuid
                  message: parameter "id" must be a valid UUID
                correlationId: 01a1faec-0000-7000-8000-000000000011
            invalidCursor:
              value:
                error:
                  code: invalid_cursor
                  message: cursor parameter is malformed
                correlationId: 01a1faec-a0d0-7993-b4bd-4e236b3a2eed
    InvalidUUIDOrMalformedJSON:
      description: Invalid UUID path parameter or malformed JSON request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidUuid:
              value:
                error:
                  code: invalid_uuid
                  message: parameter "id" must be a valid UUID
                correlationId: 01a1faec-0000-7000-8000-000000000011
            malformedJson:
              value:
                error:
                  code: malformed_json
                  message: 'malformed JSON request: json: unknown field "foo"'
                correlationId: 01a1faec-0000-7000-8000-000000000010
    BadCursor:
      description: Malformed pagination cursor
      content:
        application/json:
          schema:
