openapi: 3.0.3
info:
  title: Event-Driven Notification System API
  version: 0.3.0
  description: |
    Scalable multi-channel event-driven notification management and delivery service (SMS, Email, Push).
    PostgreSQL is the authoritative system of record; Redis provides prioritized asynchronous dispatch queues.
servers:
  - url: http://localhost:8080
    description: Local API server

tags:
  - name: System
    description: Health probes and OpenAPI contract
  - name: Notifications
    description: Single and batch notification submission, queries, cancellation, and manual retry
  - name: Batches
    description: Batch status aggregation and bulk cancellation

paths:
  /health/live:
    get:
      tags: [System]
      summary: Liveness probe
      description: Returns 200 OK when the API process is running and serving HTTP requests.
      responses:
        "200":
          description: Process is alive
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
              example:
                status: ok

  /openapi.yaml:
    get:
      tags: [System]
      summary: Download OpenAPI specification
      description: Serves the embedded OpenAPI 3.0.3 YAML document.
      responses:
        "200":
          description: OpenAPI YAML document
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/notifications:
    post:
      tags: [Notifications]
      summary: Create a single notification
      description: |
        Validates and persists a pending notification atomically with its optional Idempotency-Key in PostgreSQL,
        then enqueues it for asynchronous worker processing.
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
            examples:
              turkishSms:
                summary: Turkish SMS high priority notification
                value:
                  recipient: "+905551234567"
                  channel: sms
                  content: "Siparişiniz kargoya verildi"
                  priority: high
              email:
                summary: Email notification with optional subject
                value:
                  recipient: "customer@example.com"
                  channel: email
                  subject: "Order #42 Shipped"
                  content: "Your order has left our warehouse."
                  priority: normal
              push:
                summary: Push notification with title
                value:
                  recipient: "fcm-token-9b7a2c1e"
                  channel: push
                  title: "Package Delivered"
                  content: "Your delivery has arrived."
      responses:
        "202":
          description: Notification accepted for asynchronous delivery (or replayed via Idempotency-Key)
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/MalformedJSON"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      tags: [Notifications]
      summary: List notifications with filters and keyset pagination
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - name: status
          in: query
          description: Comma-separated status filter (`scheduled,pending,processing,retrying,sent,failed,cancelled`)
          schema:
            type: string
            example: pending,failed
        - name: channel
          in: query
          schema:
            type: string
            enum: [sms, email, push]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, normal, low]
        - name: from
          in: query
          description: Inclusive RFC3339 lower bound on createdAt
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive RFC3339 upper bound on createdAt
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: Opaque keyset pagination cursor returned by a previous response
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated list of notifications ordered newest first
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/BadCursor"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notifications/batch:
    post:
      tags: [Notifications]
      summary: Create a batch of notifications (up to 1000 items, all-or-nothing)
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRequest"
            example:
              notifications:
                - recipient: "+905551234567"
                  channel: sms
                  content: "Kampanya kodunuz: INSIDER20"
                  priority: high
                  idempotencyKey: batch-item-1
                - recipient: "user@example.com"
                  channel: email
                  subject: "Weekly Digest"
                  content: "Hello from Insider One"
      responses:
        "202":
          description: Batch persisted atomically and queued for delivery
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
        "400":
          $ref: "#/components/responses/MalformedJSON"
        "409":
          $ref: "#/components/responses/BatchConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get notification status and delivery attempts by ID
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Notification details with chronological delivery attempts
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDetailResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/{id}/cancel:
    post:
      tags: [Notifications]
      summary: Cancel a pending, scheduled, or retrying notification
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Notification cancelled atomically
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotCancellable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/{id}/retry:
    post:
      tags: [Notifications]
      summary: Manually retry a failed notification (DLQ replay)
      description: Resets attempts and deferrals to 0, clears lastError, transitions status from failed to pending, and re-enqueues.
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Notification reset to pending and re-enqueued
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotRetryable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/batches/{id}:
    get:
      tags: [Batches]
      summary: Get batch summary counts and paginated batch items
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Batch aggregate summary and page of items
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetailResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/batches/{id}/cancel:
    post:
      tags: [Batches]
      summary: Cancel all cancellable notifications in a batch
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Atomic batch cancellation counts
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCancelResponse"
        "400":
          $ref: "#/components/responses/InvalidUUID"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [System]
      summary: Dependency readiness alias
      description: Alias for /health/ready checking PostgreSQL and Redis connectivity (1s timeout each).
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"

  /health/ready:
    get:
      tags: [System]
      summary: Readiness probe
      description: Pings PostgreSQL and Redis with a 1s timeout each and returns 503 if any fails.
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              example:
                status: ok
                checks:
                  postgres: {status: ok, latencyMs: 2}
                  redis: {status: ok, latencyMs: 1}
        "503":
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics exposition
      description: Exposes Prometheus text exposition format metrics registered on a dedicated custom Registry.
      responses:
        "200":
          description: Prometheus metrics scrape output
          content:
            text/plain:
              schema:
                type: string

  /api/v1/metrics:
    get:
      tags: [System]
      summary: Real-time JSON observability snapshot
      description: Returns live Redis queue depths, 1m/5m/15m per-channel delivery counts and rates, and 15m p50/p95/p99 latency percentiles (2s cache).
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Metrics snapshot
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationIDResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    CorrelationIDHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Client correlation identifier (1..128 chars `[A-Za-z0-9._-]`). Auto-generated if omitted or invalid.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency token (1..255 printable ASCII characters, 24h TTL).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UUIDPathParam:
      name: id
      in: path
      required: true
      description: Resource UUID (UUIDv7)
      schema:
        type: string
        format: uuid

  headers:
    CorrelationIDResponse:
      description: Echoed or server-generated request correlation ID
      schema:
        type: string
    IdempotentReplayed:
      description: Present with value `"true"` when returning a stored idempotent response
      schema:
        type: string
        enum: ["true"]

  schemas:
    LiveStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    DependencyCheck:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [ok, down]
        latencyMs:
          type: integer
          format: int64

    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [postgres, redis]
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyCheck"
            redis:
              $ref: "#/components/schemas/DependencyCheck"

    ChannelQueueDepths:
      type: object
      required: [high, normal, low]
      properties:
        high:
          type: integer
          format: int64
        normal:
          type: integer
          format: int64
        low:
          type: integer
          format: int64

    QueuesSnapshot:
      type: object
      required: [sms, email, push, delayed, dlq, inflight]
      properties:
        sms:
          $ref: "#/components/schemas/ChannelQueueDepths"
        email:
          $ref: "#/components/schemas/ChannelQueueDepths"
        push:
          $ref: "#/components/schemas/ChannelQueueDepths"
        delayed:
          type: integer
          format: int64
        dlq:
          type: integer
          format: int64
        inflight:
          type: integer
          format: int64

    WindowChannelMetrics:
      type: object
      required: [sent, failed, retrying, successRate, failureRate]
      properties:
        sent:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        retrying:
          type: integer
          format: int64
        successRate:
          type: number
          format: double
        failureRate:
          type: number
          format: double

    LatencyPercentiles:
      type: object
      required: [p50, p95, p99]
      properties:
        p50:
          type: number
          format: double
        p95:
          type: number
          format: double
        p99:
          type: number
          format: double

    LatencyMetrics:
      type: object
      required: [endToEnd, providerCall]
      properties:
        endToEnd:
          $ref: "#/components/schemas/LatencyPercentiles"
        providerCall:
          $ref: "#/components/schemas/LatencyPercentiles"

    MetricsSnapshot:
      type: object
      required: [generatedAt, queues, windows, latencyMs]
      properties:
        generatedAt:
          type: string
          format: date-time
        queues:
          $ref: "#/components/schemas/QueuesSnapshot"
        windows:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/WindowChannelMetrics"
        latencyMs:
          $ref: "#/components/schemas/LatencyMetrics"

    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [recipient, channel, content]
      properties:
        recipient:
          type: string
          description: E.164 phone number (`sms`), bare email address (`email`), or device token (`push`)
        channel:
          type: string
          enum: [sms, email, push]
        content:
          type: string
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        subject:
          type: string
          maxLength: 200
          description: Optional subject for `email` channel only
        title:
          type: string
          maxLength: 100
          description: Optional notification title for `push` channel only
        scheduledAt:
          type: string
          format: date-time
          description: Reserved for Phase 8 scheduled delivery
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          description: Supported only for items inside POST /api/v1/notifications/batch; single notifications use the Idempotency-Key header.
        templateId:
          type: string
          format: uuid
          description: Reserved for Phase 9 templates
        templateVariables:
          type: object
          additionalProperties: true
          description: Reserved for Phase 9 templates

    BatchCreateRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CreateNotificationRequest"

    NotificationResponse:
      type: object
      required:
        - id
        - batchId
        - recipient
        - channel
        - priority
        - status
        - content
        - attempts
        - maxAttempts
        - scheduledAt
        - nextAttemptAt
        - providerMessageId
        - lastError
        - createdAt
        - updatedAt
        - sentAt
        - failedAt
        - cancelledAt
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
          nullable: true
        recipient:
          type: string
        channel:
          type: string
          enum: [sms, email, push]
        priority:
          type: string
          enum: [high, normal, low]
        status:
          type: string
          enum: [scheduled, pending, processing, retrying, sent, failed, cancelled]
        subject:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        content:
          type: string
        attempts:
          type: integer
        maxAttempts:
          type: integer
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true

    DeliveryAttemptResponse:
      type: object
      required: [id, attemptNo, counted, startedAt, durationMs, httpStatus, outcome, error, providerMessageId]
      properties:
        id:
          type: integer
          format: int64
        attemptNo:
          type: integer
        counted:
          type: boolean
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        httpStatus:
          type: integer
          nullable: true
        outcome:
          type: string
          enum: [sent, transient, permanent, circuit_open, abandoned]
        error:
          type: string
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        workerId:
          type: string
          nullable: true

    NotificationDetailResponse:
      allOf:
        - $ref: "#/components/schemas/NotificationResponse"
        - type: object
          required: [deliveryAttempts]
          properties:
            deliveryAttempts:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryAttemptResponse"

    BatchCreateResponse:
      type: object
      required: [batchId, count, notificationIds]
      properties:
        batchId:
          type: string
          format: uuid
        count:
          type: integer
        notificationIds:
          type: array
          items:
            type: string
            format: uuid

    NotificationListResponse:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        nextCursor:
          type: string
          nullable: true

    BatchDetailResponse:
      type: object
      required: [batchId, total, countsByStatus, createdAt, items, nextCursor]
      properties:
        batchId:
          type: string
          format: uuid
        total:
          type: integer
        countsByStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        nextCursor:
          type: string
          nullable: true

    BatchCancelResponse:
      type: object
      required: [batchId, cancelled, notCancellable]
      properties:
        batchId:
          type: string
          format: uuid
        cancelled:
          type: integer
        notCancellable:
          type: integer

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
        correlationId:
          type: string

  responses:
    MalformedJSON:
      description: Malformed JSON, trailing tokens, or unknown fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidUUID:
      description: Invalid UUID path parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadCursor:
      description: Malformed pagination cursor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency-Key reused with a different request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BatchConflict:
      description: Batch Idempotency-Key conflict or item idempotencyKey already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotCancellable:
      description: Notification is not in a cancellable status
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_cancellable
              message: notification cannot be cancelled in status "sent"
              details:
                - field: status
                  code: current_status
                  message: sent
            correlationId: 01936f7e-0000-7000-8000-000000000001
    NotRetryable:
      description: Only failed notifications can be manually retried
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeds configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Request Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: One or more validation rules failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: request has 2 invalid fields
              details:
                - field: recipient
                  code: invalid_e164
