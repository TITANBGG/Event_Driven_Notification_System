# Uses YAML anchors instead of deploy.replicas because legacy docker-compose ignores replicas.
# Only api defines `build:` to build notification-system:local once; sibling services wait or reuse it.

x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL:-postgres://notif:notif@postgres:5432/notif?sslmode=disable}
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-0}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-0}
  PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:8090/}
  PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-10s}
  PROVIDER_EXTENDED_FIELDS: ${PROVIDER_EXTENDED_FIELDS:-false}
  RATE_LIMIT_PER_SEC: ${RATE_LIMIT_PER_SEC:-100}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-1}
  WORKER_CONCURRENCY_PER_CHANNEL: ${WORKER_CONCURRENCY_PER_CHANNEL:-25}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  RETRY_BASE: ${RETRY_BASE:-2s}
  RETRY_CAP: ${RETRY_CAP:-5m}
  RETRY_MIN: ${RETRY_MIN:-200ms}
  RETRY_AFTER_MAX: ${RETRY_AFTER_MAX:-15m}
  CB_CONSECUTIVE_FAILURES: ${CB_CONSECUTIVE_FAILURES:-10}
  CB_MIN_REQUESTS: ${CB_MIN_REQUESTS:-20}
  CB_FAILURE_RATIO: ${CB_FAILURE_RATIO:-0.5}
  CB_INTERVAL: ${CB_INTERVAL:-60s}
  CB_OPEN_TIMEOUT: ${CB_OPEN_TIMEOUT:-30s}
  CB_HALF_OPEN_MAX: ${CB_HALF_OPEN_MAX:-3}
  MAX_CIRCUIT_DEFERRALS: ${MAX_CIRCUIT_DEFERRALS:-120}
  VISIBILITY_TIMEOUT: ${VISIBILITY_TIMEOUT:-60s}
  RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-15s}
  PENDING_STALE_AFTER: ${PENDING_STALE_AFTER:-30s}
  DELAYED_MOVER_INTERVAL: ${DELAYED_MOVER_INTERVAL:-500ms}
  HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-5s}
  HEARTBEAT_TTL: ${HEARTBEAT_TTL:-15s}
  CLOCK_SKEW_TOLERANCE: ${CLOCK_SKEW_TOLERANCE:-2s}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  OTEL_SAMPLER_RATIO: ${OTEL_SAMPLER_RATIO:-1.0}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9091}

x-worker: &worker
  image: notification-system:local
  pull_policy: never
  command: ["/app/worker"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    mockprovider:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app/healthcheck", "http://localhost:9091/health/live"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notif}
      POSTGRES_DB: ${POSTGRES_DB:-notif}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notif} -d ${POSTGRES_DB:-notif}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - ${DATABASE_URL:-postgres://notif:notif@postgres:5432/notif?sslmode=disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: notification-system:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://notif:notif@postgres:5432/notif?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-0}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-0}
      WORKER_CONCURRENCY_PER_CHANNEL: ${WORKER_CONCURRENCY_PER_CHANNEL:-25}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-524288}
      BATCH_MAX_BODY_BYTES: ${BATCH_MAX_BODY_BYTES:-16777216}
      BATCH_MAX_ITEMS: ${BATCH_MAX_ITEMS:-1000}
      PAGE_LIMIT_DEFAULT: ${PAGE_LIMIT_DEFAULT:-50}
      PAGE_LIMIT_MAX: ${PAGE_LIMIT_MAX:-200}
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
      SCHEDULE_MAX_AHEAD: ${SCHEDULE_MAX_AHEAD:-720h}
      CLOCK_SKEW_TOLERANCE: ${CLOCK_SKEW_TOLERANCE:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      MAX_WS_CLIENTS: ${MAX_WS_CLIENTS:-1000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SAMPLER_RATIO: ${OTEL_SAMPLER_RATIO:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mockprovider:
    image: notification-system:local
    pull_policy: never
    command: ["/app/mockprovider"]
    environment:
      MOCK_PORT: ${MOCK_PORT:-8090}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
      MOCK_LATENCY_JITTER_MS: ${MOCK_LATENCY_JITTER_MS:-0}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_429_RATE: ${MOCK_429_RATE:-0}
      MOCK_PERMANENT_RATE: ${MOCK_PERMANENT_RATE:-0}
      MOCK_SEED: ${MOCK_SEED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SAMPLER_RATIO: ${OTEL_SAMPLER_RATIO:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8090:8090"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8090/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker-1:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-1

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-2

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./api:/spec:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
