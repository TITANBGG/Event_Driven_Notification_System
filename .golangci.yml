version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - bodyclose
    - contextcheck
    - errorlint
    - noctx
    - gosec
  settings:
    gosec:
      excludes:
        - G404 # math/rand is intentional for backoff jitter and mock fault injection
  exclusions:
    paths:
      - internal/repository/sqlc
    rules:
      - path: _test\.go
        text: "G101"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
