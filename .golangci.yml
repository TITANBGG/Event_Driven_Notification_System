# WHAT: golangci-lint v2 configuration enforcing static safety, resource cleanup, and style across the repo.
# WHY: Catches HTTP body leaks (bodyclose), missing request context (noctx), error wrapping mistakes (errorlint),
#      and slow HTTP server vulnerabilities (gosec) before code reaches CI or production.
# EXPECTED OUTPUT EXAMPLE (`golangci-lint run`):
#   0 issues.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - bodyclose
    - contextcheck
    - errorlint
    - noctx
    - gosec
  settings:
    gosec:
      excludes:
        - G404 # math/rand is intentional for exponential-backoff jitter and mock fault injection
  exclusions:
    paths:
      - internal/repository/sqlc

formatters:
  enable:
    - gofmt
    - goimports

